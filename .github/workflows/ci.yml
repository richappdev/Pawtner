name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://rlwctljjjvlxrexcgqmg.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-key-for-ci
      - name: Validate SQL migrations exist
        run: |
          test -d supabase/migrations
          test -n "$(ls -A supabase/migrations)"
      - name: Secret scan (basic)
        run: |
          if grep -RInE 'supabase_service_role|sk_live_|BEGIN RSA PRIVATE KEY' --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.next . ; then
            echo "Potential secrets found"
            exit 1
          fi
