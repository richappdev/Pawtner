name: Deploy staging frontend

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pawtner-staging-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      GCP_PROJECT_ID: pawtner-app-2026
      SUPABASE_URL: https://rlwctljjjvlxrexcgqmg.supabase.co
      FIREBASE_APP_ID: 1:611592714843:web:b10424774e91a6ff9add7e
      FIREBASE_MESSAGING_SENDER_ID: "611592714843"
      REGION: asia-east1
      SERVICE_NAME: pawtner-hosting-web-staging
      ARTIFACT_REPOSITORY: pawtner-images
      STAGING_SITE_ID: pawtner-tw-staging
    steps:
      - uses: actions/checkout@v6
      - id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.STAGING_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STAGING_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Build and push staging frontend image against the shared backend
        run: |
          image="$REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$SERVICE_NAME:$GITHUB_SHA"
          supabase_anon_key="$(gcloud secrets versions access latest --secret=NEXT_PUBLIC_SUPABASE_ANON_KEY --project="$GCP_PROJECT_ID")"
          firebase_api_key="$(gcloud secrets versions access latest --secret=NEXT_PUBLIC_FIREBASE_API_KEY --project="$GCP_PROJECT_ID")"
          docker build --tag "$image" \
            --build-arg PAWTNER_ENV=staging \
            --build-arg NEXT_PUBLIC_PAWTNER_ENV=staging \
            --build-arg PAWTNER_COMMIT_SHA="$GITHUB_SHA" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$supabase_anon_key" \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$firebase_api_key" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=pawtner-app-2026.firebaseapp.com \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=pawtner-app-2026 \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=pawtner-app-2026.firebasestorage.app \
            --build-arg NEXT_PUBLIC_FIREBASE_OBSERVABILITY_ENABLED=false \
            --build-arg NEXT_PUBLIC_FEATURE_FIREBASE_AUTH_ENABLED=true \
            --build-arg FEATURE_FIREBASE_AUTH_ENABLED=true \
            --build-arg FEATURE_GOVERNMENT_PETS_ENABLED=true \
            --build-arg FEATURE_CLOSED_PILOT_ADOPTION_OPERATIONS_ENABLED=true \
            --build-arg NEXT_PUBLIC_FEATURE_CLOSED_PILOT_ADOPTION_OPERATIONS_ENABLED=true \
            .
          docker push "$image"
      - id: image
        run: |
          image="$REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$SERVICE_NAME:$GITHUB_SHA"
          digest="$(gcloud artifacts docker images describe "$image" --format='value(image_summary.digest)')"
          echo "uri=$REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$SERVICE_NAME@$digest" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy staging frontend Cloud Run service
        run: |
          gcloud run deploy "$SERVICE_NAME" --project="$GCP_PROJECT_ID" --region="$REGION" \
            --image="${{ steps.image.outputs.uri }}" --service-account="${{ vars.STAGING_RUNTIME_SERVICE_ACCOUNT }}" \
            --ingress=all \
            --port=8080 --cpu=1 --memory=1Gi --min=0 --max=10 --concurrency=80 \
            --set-env-vars="PAWTNER_ENV=staging,NEXT_PUBLIC_PAWTNER_ENV=staging,PAWTNER_COMMIT_SHA=$GITHUB_SHA,PAWTNER_IMAGE_DIGEST=${{ steps.image.outputs.digest }},NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=pawtner-app-2026.firebaseapp.com,NEXT_PUBLIC_FIREBASE_PROJECT_ID=pawtner-app-2026,NEXT_PUBLIC_FIREBASE_APP_ID=$FIREBASE_APP_ID,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID,FIREBASE_ADMIN_PROJECT_ID=pawtner-app-2026,FEATURE_FIREBASE_AUTH_ENABLED=true,NEXT_PUBLIC_FEATURE_FIREBASE_AUTH_ENABLED=true,FEATURE_GOVERNMENT_PETS_ENABLED=true,FEATURE_CLOSED_PILOT_ADOPTION_OPERATIONS_ENABLED=true,NEXT_PUBLIC_FEATURE_CLOSED_PILOT_ADOPTION_OPERATIONS_ENABLED=true,NEXT_PUBLIC_SITE_URL=https://$STAGING_SITE_ID.web.app" \
            --set-secrets="NEXT_PUBLIC_SUPABASE_ANON_KEY=NEXT_PUBLIC_SUPABASE_ANON_KEY:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,NEXT_PUBLIC_FIREBASE_API_KEY=NEXT_PUBLIC_FIREBASE_API_KEY:latest"
      - name: Staging frontend smoke
        run: |
          curl --fail --retry 5 --retry-delay 5 "https://$STAGING_SITE_ID.web.app/api/health"
          curl --fail --retry 5 --retry-delay 5 "https://$STAGING_SITE_ID.web.app/recommend"
