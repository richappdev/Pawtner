steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv:
      - NEXT_PUBLIC_SUPABASE_ANON_KEY
      - NEXT_PUBLIC_FIREBASE_API_KEY
    args:
      - -ceu
      - |
        docker build \
          --tag "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE_NAME}:${_IMAGE_TAG}" \
          --build-arg PAWTNER_ENV="${_PAWTNER_ENV}" \
          --build-arg NEXT_PUBLIC_PAWTNER_ENV="${_PAWTNER_ENV}" \
          --build-arg PAWTNER_COMMIT_SHA="${_IMAGE_TAG}" \
          --build-arg NEXT_PUBLIC_SUPABASE_URL="${_SUPABASE_URL}" \
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$${NEXT_PUBLIC_FIREBASE_API_KEY}" \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${_FIREBASE_AUTH_DOMAIN}" \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${_FIREBASE_PROJECT_ID}" \
          --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${_FIREBASE_APP_ID}" \
          --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${_FIREBASE_MESSAGING_SENDER_ID}" \
          --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${_FIREBASE_STORAGE_BUCKET}" \
          --build-arg NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID="${_FIREBASE_MEASUREMENT_ID}" \
          --build-arg NEXT_PUBLIC_FIREBASE_OBSERVABILITY_ENABLED="${_FIREBASE_OBSERVABILITY_ENABLED}" \
          --build-arg NEXT_PUBLIC_FEATURE_FIREBASE_AUTH_ENABLED="true" \
          --build-arg FEATURE_FIREBASE_AUTH_ENABLED="true" \
          --build-arg FEATURE_GOVERNMENT_PETS_ENABLED="${_GOVERNMENT_PETS_ENABLED}" \
          --build-arg FEATURE_CLOSED_PILOT_ADOPTION_OPERATIONS_ENABLED="${_ADOPTION_OPERATIONS_ENABLED}" \
          --build-arg NEXT_PUBLIC_FEATURE_CLOSED_PILOT_ADOPTION_OPERATIONS_ENABLED="${_ADOPTION_OPERATIONS_ENABLED}" \
          .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE_NAME}:${_IMAGE_TAG}

substitutions:
  _REGION: asia-east1
  _ARTIFACT_REPOSITORY: pawtner-images
  _SERVICE_NAME: pawtner-hosting-web
  _IMAGE_TAG: latest
  _PAWTNER_ENV: local
  _SUPABASE_URL: http://127.0.0.1:54321
  _FIREBASE_AUTH_DOMAIN: pawtner-local.firebaseapp.com
  _FIREBASE_PROJECT_ID: pawtner-local
  _FIREBASE_APP_ID: 1:000000000000:web:local
  _FIREBASE_MESSAGING_SENDER_ID: "000000000000"
  _FIREBASE_STORAGE_BUCKET: ""
  _FIREBASE_MEASUREMENT_ID: ""
  _FIREBASE_OBSERVABILITY_ENABLED: "false"
  _GOVERNMENT_PETS_ENABLED: "false"
  _ADOPTION_OPERATIONS_ENABLED: "false"

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_SUPABASE_ANON_KEY/versions/latest
      env: NEXT_PUBLIC_SUPABASE_ANON_KEY
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_API_KEY/versions/latest
      env: NEXT_PUBLIC_FIREBASE_API_KEY
