steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv:
      - NEXT_PUBLIC_SUPABASE_ANON_KEY
      - NEXT_PUBLIC_FIREBASE_API_KEY
    args:
      - -ceu
      - |
        docker build \
          --tag "asia-east1-docker.pkg.dev/$PROJECT_ID/pawtner-images/pawtner-hosting-web:${_IMAGE_TAG}" \
          --build-arg NEXT_PUBLIC_SUPABASE_URL="https://rlwctljjjvlxrexcgqmg.supabase.co" \
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$${NEXT_PUBLIC_FIREBASE_API_KEY}" \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="pawtner-app-2026.firebaseapp.com" \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="pawtner-app-2026" \
          --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="1:611592714843:web:b10424774e91a6ff9add7e" \
          --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="611592714843" \
          --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="pawtner-app-2026.firebasestorage.app" \
          --build-arg NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID="${_FIREBASE_MEASUREMENT_ID}" \
          --build-arg NEXT_PUBLIC_FIREBASE_OBSERVABILITY_ENABLED="${_FIREBASE_OBSERVABILITY_ENABLED}" \
          --build-arg NEXT_PUBLIC_FEATURE_FIREBASE_AUTH_ENABLED="true" \
          --build-arg FEATURE_FIREBASE_AUTH_ENABLED="true" \
          --build-arg FEATURE_GOVERNMENT_PETS_ENABLED="true" \
          .

images:
  - asia-east1-docker.pkg.dev/$PROJECT_ID/pawtner-images/pawtner-hosting-web:${_IMAGE_TAG}

substitutions:
  _IMAGE_TAG: latest
  # Override after GA4 is enabled for the Firebase web app.
  _FIREBASE_MEASUREMENT_ID: ""
  _FIREBASE_OBSERVABILITY_ENABLED: "false"

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_SUPABASE_ANON_KEY/versions/1
      env: NEXT_PUBLIC_SUPABASE_ANON_KEY
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_API_KEY/versions/3
      env: NEXT_PUBLIC_FIREBASE_API_KEY
